---
# tasks file for rules/kubernetes_rule

- name: Get token to join worker nodes to k8s cluster
  ansible.builtin.shell: kubeadm token create --print-join-command
  register: kubernetes_join_command
  when: "'master_node' in group_names"

- name: Copy join command to local file on Ansible host
  become: yes
  local_action: copy content="{{ kubernetes_join_command.stdout_lines[0] }}" dest="/tmp/kubernetes_join_command" mode=0777
  when: "'master_node' in group_names"



- name: Copy join command script from master to worker
  ansible.builtin.copy:
        src: '/tmp/kubernetes_join_command'
        dest:  '/tmp/kubernetes_join_command'
        mode: '0755'

- name: Join the Worker nodes to the cluster
  ansible.builtin.shell: "/tmp/kubernetes_join_command --ignore-preflight-errors all"
  register: joined_or_not
  when: "'worker_nodes' in group_names"
  become: yes

- name: Node join status
  ansible.builtin.debug:
    msg: "{{ joined_or_not.stdout }}"
  when: "'worker_nodes' in group_names"
